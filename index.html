<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="profile-card.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Big+Shoulders:opsz,wght@10..72,100..900&family=Figtree:ital,wght@0,300..900;1,300..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght@100..900&family=Lexend+Deca:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
        <title>Profile Card</title>
    </head>
    <body>
        <main>
            <section class="profile-card">
                <img class="background" src="bg-pattern-card.svg" alt="">
                <header>
                    <h1>Profile Card</h1>
                    <figure>
                        <img class="avatar" src="image-victor.jpg" alt="Victor's Profile Picture">
                        <figcaption>
                            <h2>Victor Crest  <span class="age">26</span></h2>
                            <p class="location">London</p>
                        </figcaption>
                    </figure>
                </header>
                <hr>
                <dl>
                    <div class="list1">
                        <dt>Followers</dt>
                        <dd>80K</dd>
                    </div>
                    <div class="list2">
                        <dt>Likes</dt>
                        <dd>803K</dd>
                    </div>
                    <div class="list3">
                        <dt>Photos</dt>
                        <dd>1.4K</dd>
                    </div>
                </dl>
            </section>
        </main>
    </body>
</html>
